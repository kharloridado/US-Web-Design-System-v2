name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Theme, Block bundles and assets
        run: npm run build
      - name: Parity with official USWDS bundle
        run: npm run check
      - name: dist/ is committed and up to date
        run: test -z "$(git status --porcelain -- dist)" || (git status --short -- dist; exit 1)
