name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Theme, Block bundles and assets
        run: npm run build
      - name: Parity with official USWDS bundle
        run: npm run check
      - name: Acceptance inventory from USWDS stories and specs
        run: npm run inventory
      - name: dist/ and docs/acceptance/ are committed and up to date
        run: test -z "$(git status --porcelain -- dist docs/acceptance)" || (git status --short -- dist docs/acceptance; exit 1)

  reference:
    # Renders every public USWDS variant from the official package and checks it
    # in Chromium. Produces the baselines O11 Style Guide screens are compared to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render all USWDS variants
        run: npm run reference:render
      - name: Cache images USWDS stories hotlink
        run: npm run reference:fetch
      - name: Verify in Chromium, capture baselines and screenshots
        run: npm run reference:screenshots
      - name: Test USWDS custom elements against the reference pages
        run: npm run test:elements
      - name: Accessibility baselines are committed and up to date
        run: test -z "$(git status --porcelain -- reference/aria)" || (git status --short -- reference/aria; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: uswds-reference-screenshots
          path: reference/screenshots/
          retention-days: 30

  behavior:
    # USWDS's own behavior cases (packages/*/src/test/*.spec.js), ported to
    # Playwright, on USWDS's spec fixtures. Definition of Done gate 6.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every USWDS behavior case is ported or accounted for
        run: npm run check:behavior
      - name: Run the ported cases on USWDS's fixtures
        run: npm run test:behavior
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: behavior-test-results
          path: test-results/
          retention-days: 14
