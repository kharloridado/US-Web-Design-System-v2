- list:
  - listitem:
    - heading "Let the sun shine." [level=3]
    - paragraph: On sunny days, open your curtains to allow the sun to naturally warm the rooms of your home without using electricity. Natural sunlight can also lift your mood to help brighten your day. On warm days, close your curtains to help keep your house cool.
  - listitem:
    - heading "Adjust your schedule." [level=3]
    - paragraph: Instead of running high-energy-use appliances such as dishwashers and clothes dryers during mid-afternoon or early evening hours, operate them early in the morning or late at night. Some utilities charge less at off-peak times, which will help reduce your costs.
  - listitem:
    - heading "Fill it up." [level=3]
    - paragraph: Wash full loads, whether it’s clothes or dishes. Washing multiple small loads means you’re using and heating more water, which can increase your expenses. Using cold water for clothes washing can also help lower your costs.
