    - heading "Women-owned small business dashboard" [level=3]:
      - link "Women-owned small business dashboard":
        - /url: https://trumpadministration.archives.performance.gov/sba-wosb-dashboard/
    - paragraph: In honor of National Women’s Small Business Month, we’ve partnered with SBA’s Office of Government Contracting and Business Development and Office of Program Performance, Analysis, and Evaluation to highlight the Women-Owned Small Businesses (WOSBs) data dashboard!
  - listitem:
    - time: SEP 17
    - heading "September 2020 updates show progress on cross-agency and agency priority goals" [level=3]:
      - link "September 2020 updates show progress on cross-agency and agency priority goals":
        - /url: https://trumpadministration.archives.performance.gov/September-2020-Updates-Show-Progress/
    - paragraph: Today, we published progress updates for both Cross-Agency Priority (CAP) Goals and Agency Priority Goals (APGs) for the third quarter of FY2020. These updates highlight recent milestones and accomplishments as well as related initiatives that support progress towards a more modern and effective government.
