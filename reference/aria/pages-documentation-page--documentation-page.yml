- main:
  - heading "Page heading (h1)" [level=1]
  - paragraph: The page heading communicates the main focus of the page. Make your page heading descriptive and keep it succinct.
  - heading "Section heading (h2)" [level=2]
  - paragraph: "These headings introduce, respectively, sections and subsections within your body copy. As you create these headings, follow the same guidelines that you use when writing section headings: Be succinct, descriptive, and precise."
  - heading "Subsection heading (h3)" [level=3]
  - paragraph: "The particulars of your body copy will be determined by the topic of your page. Regardless of topic, it’s a good practice to follow the inverted pyramid structure when writing copy: Begin with the information that’s most important to your users and then present information of less importance."
  - paragraph: Keep each section and subsection focused — a good approach is to include one theme (topic) per section.
  - heading "Subsection heading (h4)" [level=4]
  - paragraph: Use the side navigation menu to help your users quickly skip to different sections of your page. The menu is best suited to displaying a hierarchy with one to three levels and, as we mentioned, to display the sub-navigation of a given page.
  - paragraph: Read the full documentation on our side navigation on the component page.
