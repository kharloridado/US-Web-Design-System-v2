- list:
  - listitem:
    - heading "Donate cash when possible." [level=3]
    - paragraph: Financial contributions to recognized disaster relief organizations are the fastest, most flexible and most effective method of donating. Organizations on the ground know what items and quantities are needed, often buy in bulk with discounts and, if possible, purchase through businesses local to the disaster, which supports economic recovery.
  - listitem:
    - heading "Confirm what donations are needed." [level=3]
    - paragraph: Unneeded and unsolicited goods burden local organizations’ ability to meet survivors’ confirmed needs, drawing away valuable volunteer labor, transportation and warehouse space.
  - listitem:
    - heading "Talk to trusted organizations about volunteering." [level=3]
    - paragraph: Financial contributions to recognized disaster relief organizations are the fastest, most flexible and most effective method of donating. Organizations on the ground know what items and quantities are needed, often buy in bulk with discounts and, if possible, purchase through businesses local to the disaster, which supports economic recovery.
